<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/webstorm-icon-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WS playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class = "course-card" id = "card">
  <p class = "tag">Osvitna platforma</p>
  <h1>Kurs vebrozrobki</h1>
  <p id = "welcome">Vitaemo</p>

  <label for = "studentsName">Vashe ima</label>
  <input id = "studentsName" type = "text" placeholder = "Vashe ima">

  <label for = "format">Format navchanya</label>
  <select id = "format">
    <option value = "2000"> Offline - 2k</option>
    <option value = "1500"> Online - 1.5k</option>
  </select>
  <p>Vartist: <strong id = "price">2k</strong></p>
  <button id = "enrollBtn">Zapisatis</button>
  <p id = "status">Vi shew ne zapisalisa na kurs</p>

  <button id = "detailBtn" class = "secondary">Pochatktkkt</button>
  <p class = "hidden"></p>
  <button id = "themeBtn" class = "secondary">Temno tema</button>
</main>

<script src = "script.js" defer></script>
</body>
</html>
